[tox]
envlist = py310, py311, py312

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
setenv = 
        PYTHONPATH = {toxinidir}

deps = pytest
       pytest-cov
       # cvxopt is the QP solver SVM needs. It is NOT in setup.py's
       # install_requires (it is an optional extra), so without it here the
       # whole TestSVM class silently skips on every CI job and svm.py is
       # executed nowhere at all.
       cvxopt

commands =
    pytest --cov=si --cov-report=term --cov-report=xml

[testenv:begin]
commands = coverage erase


# The style gate CI enforces: plain flake8 under the setup.cfg settings
# (max-line-length = 120). The source is currently clean under this, so the
# gate starts green and stays that way.
#
# This is deliberately NOT the `flake8` env below. That one adds
# flake8-docstrings, pep8-naming and friends, which between them report ~960
# findings -- dominated by "missing docstring" (D102) and by pep8-naming
# objecting to `X`, `U`, `V`, `W` (N806/N803). Those are the conventional
# mathematical names for a data matrix and the RNN weight matrices, so
# renaming them would make the code harder to match against the formulas it
# implements, not easier. The env is kept as an aspirational target.
[testenv:lint]
basepython = python3
skip_install = true
deps = flake8
commands =
    flake8 src tests setup.py


[testenv:flake8]
basepython = python3
skip_install = true
deps =
    flake8
    flake8-bugbear
    flake8-docstrings>=1.3.1
    flake8-import-order>=0.9
    flake8-typing-imports>=1.1
    pep8-naming
commands =
    flake8 src tests setup.py

[testenv:pylint]
basepython = python3
skip_install = true
deps =
    pyflakes
    pylint!=2.5.0
commands =
    pylint src

[testenv:end]
commands =
    coverage report --omit='.tox/*'
    coverage html --omit='.tox/*'
